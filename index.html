<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>しばコレ ARラボ</title><script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#090f1b;color:white;font-family:system-ui,"Noto Sans JP",sans-serif}#camera{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;background:#101b2a}#scene{position:fixed!important;inset:0;width:100%!important;height:100%!important;z-index:1;background:transparent!important}a-scene canvas{background:transparent!important}#top{position:fixed;top:0;left:0;right:0;z-index:10;padding:calc(12px + env(safe-area-inset-top)) 16px 14px;background:linear-gradient(#091527ed,#09152700);pointer-events:none}h1{font-size:19px;margin:0}#top small{opacity:.7}#panel{position:fixed;bottom:0;left:0;right:0;z-index:11;background:#0c172cef;backdrop-filter:blur(18px);border-radius:24px 24px 0 0;border:1px solid #ffffff24;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:67vh;overflow:auto}.status{display:inline-block;border-radius:99px;background:#1b3458;padding:5px 10px;font-size:12px;margin-bottom:10px}label{display:block;font-size:13px;font-weight:bold;margin:12px 0 6px}select,input[type=file],button{font:inherit}select{width:100%;background:#1b2a43;border:1px solid #486184;color:white;border-radius:11px;padding:12px}button{border:0;border-radius:12px;padding:12px 14px;background:#4d9eff;color:#071120;font-weight:750;cursor:pointer}button.secondary{background:#233955;color:#fff}input[type=range]{width:100%;accent-color:#64abff}.scale{display:flex;align-items:center;justify-content:space-between;gap:12px}.scale span{min-width:58px;text-align:right;font-weight:bold}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.buttons button{flex:1}input[type=file]{width:100%;font-size:13px}#message{font-size:12px;color:#bad5f7;min-height:17px;margin-top:8px;line-height:1.5}#reticle{position:fixed;z-index:3;left:50%;top:41%;transform:translate(-50%,-50%);font-size:20px;color:#fff8;text-shadow:0 1px 3px #000;pointer-events:none}.off #panel{transform:translateY(calc(100% - 56px));transition:transform .25s}.off #panel:before{content:'設定を開く ▲';display:block;text-align:center;margin:-9px 0 18px;font-size:14px}#panel{transition:transform .25s}@media(min-width:750px){#panel{left:auto;width:370px;max-height:90vh;border-radius:24px;bottom:20px;right:20px}#top{right:400px}} </style></head><body>
<video id="camera" autoplay playsinline muted></video><a-scene id="scene" embedded vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled:false" renderer="alpha: true; antialias: true; colorManagement: true" background="color: #000000" loading-screen="enabled: false"><a-entity id="rig" camera look-controls="enabled:false" position="0 0 0"><a-entity id="anchor" position="0 0 -3"><a-entity id="sample"><a-box width=".7" height=".7" depth=".7" color="#50a9ff" rotation="0 30 0" animation="property:rotation;to:0 390 0;loop:true;dur:9000;easing:linear"></a-box><a-text value="AR TEST" align="center" position="0 -.8 0" width="3" color="#ffffff"></a-text></a-entity><a-entity id="model" visible="false"></a-entity></a-entity></a-entity></a-scene>
<div id="top"><h1>しばコレ ARラボ</h1><small>独立した3Dモデル表示テスト</small></div><div id="reticle">＋</div><div id="panel"><div id="status" class="status">● カメラ未起動</div><div class="buttons" style="margin-top:0"><button id="start">📷 カメラを起動</button><button class="secondary" id="toggle">設定を閉じる</button></div><label for="spot">表示モデル</label><select id="spot"><option value="sample">サンプル（青い立方体）</option><option value="shibata_station.glb">新発田駅</option><option value="zou.shibata_castle.glb">新発田城（ファイル名要確認）</option><option value="zou.shunkaku.glb">蔵春閣（ファイル名要確認）</option><option value="SL.glb">東公園のSL</option><option value="hellotore_kun.glb">ハロトレくん</option><option value="ikunesu.glb">イクネスしばた（ファイル名要確認）</option></select><label>自分のGLB / GLTFファイルを選択</label><input type="file" id="file" accept=".glb,.gltf,model/gltf-binary,model/gltf+json"><label>目の前までの距離</label><div class="scale"><input id="distance" type="range" min="1" max="10" value="3" step=".5"><span id="distanceValue">3.0 m</span></div><label>モデルの拡大率</label><div class="scale"><input id="size" type="range" min=".05" max="3" value="1" step=".05"><span id="sizeValue">1.00 倍</span></div><label>高さ</label><div class="scale"><input id="height" type="range" min="-3" max="3" value="0" step=".1"><span id="heightValue">0.0 m</span></div><div class="buttons"><button id="reset" class="secondary">位置・サイズ初期化</button><button id="spin" class="secondary">回転 ON/OFF</button></div><div id="message">最初はサンプル立方体が表示されます。実際のGLBはファイルを選択するか、models フォルダに配置してください。</div></div>
<script>
const $=id=>document.getElementById(id),anchor=$('anchor'),model=$('model'),sample=$('sample');let fileUrl=null,spin=false,stream=null;
function message(s){$('message').textContent=s}function placement(){let d=+$('distance').value,h=+$('height').value,z=+$('size').value;anchor.setAttribute('position',`0 ${h} ${-d}`);model.setAttribute('scale',`${z} ${z} ${z}`);sample.setAttribute('scale',`${z} ${z} ${z}`);$('distanceValue').textContent=d.toFixed(1)+' m';$('heightValue').textContent=h.toFixed(1)+' m';$('sizeValue').textContent=z.toFixed(2)+' 倍'}['distance','height','size'].forEach(id=>$(id).addEventListener('input',placement));placement();
function loadModel(src){model.removeAttribute('gltf-model');model.setAttribute('visible',false);sample.setAttribute('visible',false);if(!src){sample.setAttribute('visible',true);message('サンプルモデルを表示中');return}message('読み込み中… '+src);model.setAttribute('gltf-model',`url(${src})`)}
model.addEventListener('model-loaded',()=>{model.setAttribute('visible',true);message('モデルの読み込みに成功しました。見えない場合は拡大率を小さくしてみてください。')});model.addEventListener('model-error',()=>{sample.setAttribute('visible',true);message('モデルを読み込めませんでした。ファイルを選択するか、models フォルダとファイル名を確認してください。')});
$('spot').onchange=()=>{const v=$('spot').value;loadModel(v==='sample'?null:'models/'+v)};$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;if(fileUrl)URL.revokeObjectURL(fileUrl);fileUrl=URL.createObjectURL(f);loadModel(fileUrl);message('選択したモデルを読み込み中: '+f.name)};
$('start').onclick=async()=>{try{if(!navigator.mediaDevices?.getUserMedia)throw new Error('HTTPSで開いてください');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});$('camera').srcObject=stream;await $('camera').play();$('status').textContent='● カメラ起動中';$('status').style.background='#194b42';message('カメラを起動しました。端末を動かしてもモデルは画面正面に表示されます。')}catch(e){message('カメラを起動できません: '+e.message+'。HTTPSとカメラ権限を確認してください。')}};
$('toggle').onclick=()=>{const off=document.body.classList.toggle('off');$('toggle').textContent=off?'設定を開く':'設定を閉じる'};
$('reset').onclick=()=>{$('distance').value=3;$('size').value=1;$('height').value=0;placement()};$('spin').onclick=()=>{spin=!spin;model.setAttribute('animation',spin?'property:rotation;to:0 360 0;loop:true;dur:10000;easing:linear':'enabled:false');$('spin').textContent=spin?'回転停止':'回転 ON/OFF'};
// Camera passthrough: transparent WebGL canvas over the actual device camera video.
$('scene').addEventListener('loaded',()=>{const sc=$('scene');sc.setAttribute('background','color: #000000');sc.renderer.setClearColor(0x000000,0);sc.renderer.setClearAlpha(0);sc.object3D.background=null;});
window.addEventListener('pagehide',()=>{if(stream)stream.getTracks().forEach(t=>t.stop());if(fileUrl)URL.revokeObjectURL(fileUrl)});
</script></body></html>
